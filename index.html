<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бросок мяча в сетку</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            margin-top: 0;
            color: #333;
            font-size: 22px;
        }

        .score-board {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
        }

        .playground {
            position: relative;
            width: 400px;
            height: 350px;
            background: #eef2f3;
            border: 2px dashed #ccc;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Баскетбольный щит и кольцо */
        .backboard {
            position: absolute;
            top: 40px;
            right: 30px;
            width: 10px;
            height: 80px;
            background: #b0bec5;
        }

        .hoop {
            position: absolute;
            top: 95px;
            right: 40px;
            width: 55px;
            height: 8px;
            background: #ff5722;
            border-radius: 2px;
            z-index: 2;
        }

        .net {
            position: absolute;
            top: 103px;
            right: 43px;
            width: 45px;
            height: 50px;
            border: 2px dashed #b0bec5;
            border-top: none;
            background: rgba(255, 255, 255, 0.4);
        }

        /* Мальчик */
        .player {
            position: absolute;
            bottom: 20px;
            left: 30px;
            font-size: 50px;
            transition: transform 0.2s;
        }

        /* Мяч */
        .ball {
            position: absolute;
            bottom: 50px;
            left: 70px;
            width: 26px;
            height: 26px;
            background: radial-gradient(circle at 30% 30%, #ff7043, #d84315);
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 3;
        }

        /* Кнопка */
        .btn-throw {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-throw:hover {
            background-color: #e64a19;
        }

        .message {
            height: 20px;
            font-weight: bold;
            margin-top: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Брось мяч в сетку!</h1>
        <div class="score-board">Очки: <span id="score">0</span> | Промахи: <span id="misses">0</span></div>

        <div class="playground" id="playground">
            <!-- Щит, кольцо и сетка -->
            <div class="backboard"></div>
            <div class="hoop" id="hoopElement"></div>
            <div class="net"></div>

            <!-- Мальчик и мяч -->
            <div class="player" id="player">👦</div>
            <div class="ball" id="ball"></div>
        </div>

        <button class="btn-throw" id="throwBtn">Бросить мяч!</button>
        <div class="message" id="message"></div>
    </div>

    <script>
        const throwBtn = document.getElementById('throwBtn');
        const ball = document.getElementById('ball');
        const player = document.getElementById('player');
        const scoreElement = document.getElementById('score');
        const missesElement = document.getElementById('misses');
        const messageElement = document.getElementById('message');

        let score = 0;
        let misses = 0;
        let isThrowing = false;

        throwBtn.addEventListener('click', () => {
            if (isThrowing) return;
            isThrowing = true;
            messageElement.textContent = '';

            // Анимация броска мальчика (легкий наклон вперед)
            player.style.transform = 'rotate(-15deg) translateY(-5px)';

            // Начальные координаты мяча относительно площадки
            let startX = 70;
            let startY = 50; // снизу
            
            // Цель: координаты кольца (примерно в правом верхнем углу)
            let targetX = 285;
            let targetY = 225; // расстояние сверху в пикселях контейнера

            // Случайный разброс, чтобы мяч иногда летел мимо (делает игру интереснее!)
            let isHit = Math.random() > 0.4; // 60% шанс попадания
            if (!isHit) {
                targetX += (Math.random() > 0.5 ? 45 : -45); // перелет или недолет
            }

            let startTime = null;
            let duration = 700; // длительность полета в мс

            function animateThrow(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = (timestamp - startTime) / duration;
                if (progress > 1) progress = 1;

                // Формула параболы для полета мяча
                let currentX = startX + (targetX - startX) * progress;
                let baseLayerY = startY + (targetY - startY) * progress;
                // Параболическое смещение вверх (чем ближе к центру, тем выше поднимается)
                let heightArc = -120 * Math.sin(progress * Math.PI); 
                let currentY = baseLayerY + heightArc;

                // Применяем координаты к мячу (в CSS используем bottom и left)
                ball.style.left = currentX + 'px';
                ball.style.bottom = currentY + 'px';
                ball.style.transform = `rotate(${progress * 720}deg)`;

                if (progress < 1) {
                    requestAnimationFrame(animateThrow);
                } else {
                    // Возвращаем мальчика в исходное положение
                    player.style.transform = 'rotate(0deg) translateY(0)';

                    if (isHit) {
                        score += 1;
                        scoreElement.textContent = score;
                        messageElement.style.color = '#2e7d32';
                        messageElement.textContent = 'Точно в сетку! Гол! 🏀';
                    } else {
                        misses += 1;
                        missesElement.textContent = misses;
                        messageElement.style.color = '#c62828';
                        messageElement.textContent = 'Мимо! Попробуйте еще раз.';
                    }

                    // Возвращаем мяч на исходную позицию через паузу
                    setTimeout(() => {
                        ball.style.left = '70px';
                        ball.style.bottom = '50px';
                        ball.style.transform = 'rotate(0deg)';
                        isThrowing = false;
                    }, 800);
                }
            }

            requestAnimationFrame(animateThrow);
        });
    </script>
</body>
</html>
