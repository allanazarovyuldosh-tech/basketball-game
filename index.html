<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бросок мяча в сетку</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        .score-board {
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #555;
        }

        .playground {
            position: relative;
            width: 400px;
            height: 350px;
            background: #eef2f3;
            border: 2px dashed #ccc;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Кольцо и сетка */
        .hoop {
            position: absolute;
            top: 50px;
            right: 40px;
            width: 60px;
            height: 10px;
            background: #ff5722;
            border-radius: 2px;
        }

        .net {
            position: absolute;
            top: 10px;
            left: 5px;
            width: 50px;
            height: 40px;
            border: 2px dashed #ddd;
            border-top: none;
            background: rgba(255,255,255,0.5);
        }

        /* Мальчик */
        .player {
            position: absolute;
            bottom: 20px;
            left: 40px;
            font-size: 45px;
        }

        /* Мяч */
        .ball {
            position: absolute;
            bottom: 45px;
            left: 75px;
            font-size: 24px;
            transition: transform 0.8s ease-in-out;
        }

        /* Кнопка */
        .btn-throw {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-throw:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Брось мяч в сетку!</h1>
        <div class="score-board">Очки: <span id="score">0</span></div>

        <div class="playground">
            <!-- Баскетбольное кольцо / сетка -->
            <div class="hoop" id="hoop">
                <div class="net"></div>
            </div>

            <!-- Мальчик и мяч -->
            <div class="player" id="player">👦</div>
            <div class="ball" id="ball">🏀</div>
        </div>

        <button class="btn-throw" id="throwBtn">Бросить мяч!</button>
    </div>

    <script>
        const throwBtn = document.getElementById('throwBtn');
        const ball = document.getElementById('ball');
        const scoreElement = document.getElementById('score');

        let score = 0;
        let isThrowing = false;

        throwBtn.addEventListener('click', () => {
            if (isThrowing) return;
            isThrowing = true;

            // Запускаем анимацию полёта мяча по параболе
            ball.style.transform = 'translate(215px, -110px) rotate(360deg)';

            setTimeout(() => {
                score += 1;
                scoreElement.textContent = score;

                setTimeout(() => {
                    ball.style.transition = 'none';
                    ball.style.transform = 'translate(0, 0) rotate(0deg)';
                    
                    setTimeout(() => {
                        ball.style.transition = 'transform 0.8s ease-in-out';
                        isThrowing = false;
                    }, 50);
                }, 300);

            }, 800);
        });
    </script>
</body>
</html>
