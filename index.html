<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Супер Бросок: Баскетбольная Дуэль</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            user-select: none;
        }

        .game-container {
            text-align: center;
            background: #ffffff;
            color: #333;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 420px;
        }

        h1 {
            margin-top: 0;
            font-size: 20px;
            color: #ff5722;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
            background: #f1f3f5;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .playground {
            position: relative;
            width: 100%;
            height: 280px;
            background: linear-gradient(to bottom, #e0f7fa, #80deea);
            border: 3px solid #b0bec5;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        /* Подвижный блок кольца */
        .hoop-group {
            position: absolute;
            top: 30px;
            right: 25px;
            width: 60px;
            height: 100px;
            transition: top 0.3s;
        }

        .backboard {
            position: absolute;
            top: 0;
            right: 0;
            width: 10px;
            height: 80px;
            background: #37474f;
            border-radius: 2px;
        }

        .hoop {
            position: absolute;
            top: 65px;
            right: 12px;
            width: 50px;
            height: 7px;
            background: #ff3d00;
            border-radius: 2px;
            z-index: 5;
        }

        .net {
            position: absolute;
            top: 72px;
            right: 15px;
            width: 42px;
            height: 45px;
            border: 2px dashed rgba(255, 255, 255, 0.9);
            border-top: none;
            background: rgba(255, 255, 255, 0.2);
            z-index: 4;
            transform-origin: top center;
        }

        .net.swing {
            animation: netSwing 0.4s ease-in-out;
        }

        @keyframes netSwing {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            50% { transform: rotate(-15deg); }
            75% { transform: rotate(8deg); }
            100% { transform: rotate(0deg); }
        }

        /* Персонаж */
        .player {
            position: absolute;
            bottom: 15px;
            left: 35px;
            width: 45px;
            height: 80px;
            z-index: 3;
        }

        .player-head {
            position: absolute;
            top: 0;
            left: 10px;
            width: 26px;
            height: 26px;
            background: #ffccbc;
            border-radius: 50%;
            border: 2px solid #d84315;
        }

        .player-body {
            position: absolute;
            top: 26px;
            left: 11px;
            width: 24px;
            height: 30px;
            background: #1976d2;
            border-radius: 5px;
        }

        .player-arm {
            position: absolute;
            top: 30px;
            left: 22px;
            width: 22px;
            height: 7px;
            background: #ffccbc;
            border-radius: 4px;
            transform-origin: left center;
            transition: transform 0.2s;
        }

        .player-legs {
            position: absolute;
            bottom: 0;
            left: 13px;
            width: 20px;
            height: 24px;
            background: #37474f;
            border-radius: 4px;
        }

        /* Мяч */
        .ball {
            position: absolute;
            bottom: 45px;
            left: 65px;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #ff7043, #d84315);
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 6;
        }

        /* Индикатор силы */
        .power-bar-container {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 10px;
            overflow: hidden;
            display: none;
        }

        .power-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, #4caf50, #ffeb3b, #f44336);
        }

        /* Кнопки */
        .btn {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255,87,34,0.4);
            transition: all 0.2s;
            width: 100%;
        }

        .btn:hover {
            background-color: #e64a19;
        }

        .message {
            height: 20px;
            font-weight: bold;
            margin-top: 6px;
            font-size: 14px;
        }

        .records {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 6px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🏀 Баскетбольная Дуэль</h1>
        
        <div class="info-panel">
            <span>Очки: <b id="score" style="color: #2e7d32;">0</b></span>
            <span>Уровень: <b id="level" style="color: #1565c0;">1</b></span>
            <span>Время: <b id="timer" style="color: #c62828;">30</b>с</span>
        </div>

        <div class="playground" id="playground">
            <!-- Подвижное кольцо -->
            <div class="hoop-group" id="hoopGroup">
                <div class="backboard"></div>
                <div class="hoop" id="hoopElement"></div>
                <div class="net" id="net"></div>
            </div>

            <!-- Персонаж -->
            <div class="player" id="player">
                <div class="player-head"></div>
                <div class="player-body"></div>
                <div class="player-arm" id="playerArm"></div>
                <div class="player-legs"></div>
            </div>

            <!-- Мяч -->
            <div class="ball" id="ball"></div>
        </div>

        <div class="power-bar-container" id="powerContainer">
            <div class="power-bar" id="powerBar"></div>
        </div>

        <button class="btn" id="actionBtn">Начать игру!</button>
        <div class="message" id="message">Нажмите кнопку, чтобы запустить таймер!</div>
        
        <div class="records">
            🏆 Рекорд: <span id="highScore">0</span> очков
        </div>
    </div>

    <script>
        const actionBtn = document.getElementById('actionBtn');
        const ball = document.getElementById('ball');
        const playerArm = document.getElementById('playerArm');
        const net = document.getElementById('net');
        const hoopGroup = document.getElementById('hoopGroup');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const timerElement = document.getElementById('timer');
        const messageElement = document.getElementById('message');
        const powerContainer = document.getElementById('powerContainer');
        const powerBar = document.getElementById('powerBar');
        const highScoreElement = document.getElementById('highScore');

        let score = 0;
        let level = 1;
        let timeLeft = 30;
        let gameInterval = null;
        let hoopMoveInterval = null;
        let hoopDirection = 1;
        let hoopTop = 30;

        let isPlaying = false;
        let isHolding = false;
        let isThrowing = false;
        let power = 0;
        let powerInterval;

        // Загрузка рекорда из памяти браузера
        let highScore = localStorage.getItem('basketHighScore') || 0;
        highScoreElement.textContent = highScore;

        // Генерация звуков с помощью Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;
            if (type === 'charge') {
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'goal') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(500, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'miss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // Кнопка старта / броска
        actionBtn.addEventListener('mousedown', handleActionDown);
        actionBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleActionDown(); });
        window.addEventListener('mouseup', handleActionUp);
        window.addEventListener('touchend', handleActionUp);

        function handleActionDown() {
            if (!isPlaying) {
                startGame();
                return;
            }
            if (isThrowing || isHolding) return;

            isHolding = true;
            power = 0;
            powerContainer.style.display = 'block';
            messageElement.textContent = 'Рассчитывайте силу...';
            playerArm.style.transform = 'rotate(-45deg)';

            powerInterval = setInterval(() => {
                power += 4;
                if (power > 100) power = 0;
                powerBar.style.width = power + '%';
            }, 30);
        }

        function handleActionUp() {
            if (!isPlaying || !isHolding || isThrowing) return;
            isHolding = false;
            clearInterval(powerInterval);
            isThrowing = true;
            powerContainer.style.display = 'none';
            playerArm.style.transform = 'rotate(10deg)';

            // Расчет попадания с учетом уровня (на высоких уровнях кольцо движется)
            let startX = 65;
            let startY = 45;
            let targetX = 290;
            // Точная позиция кольца по вертикали зависит от его движения
            let currentHoopY = hoopTop + 65; 
            let targetY = 280 - currentHoopY;

            let isHit = (power >= 55 && power <= 82);
            if (!isHit) {
                targetX += (power < 55 ? -50 : 60);
            }

            let startTime = null;
            let duration = 500;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = (timestamp - startTime) / duration;
                if (progress > 1) progress = 1;

                let currentX = startX + (targetX - startX) * progress;
                let baseLayerY = startY + (targetY - startY) * progress;
                let heightArc = -130 * Math.sin(progress * Math.PI);
                let currentY = baseLayerY + heightArc;

                ball.style.left = currentX + 'px';
                ball.style.bottom = currentY + 'px';
                ball.style.transform = `rotate(${progress * 720}deg)`;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    if (isHit) {
                        score += level; // На высоких уровнях очков больше за попадание!
                        scoreElement.textContent = score;
                        messageElement.style.color = '#2e7d32';
                        messageElement.textContent = `🎯 Гол! +${level} очка`;
                        playSound('goal');

                        net.classList.add('swing');
                        setTimeout(() => net.classList.remove('swing'), 400);

                        // Повышение уровня каждые 5 очков
                        if (score >= level * 5) {
                            level++;
                            levelElement.textContent = level;
                            messageElement.textContent = `⭐ Уровень ${level}! Кольцо движется быстрее!`;
                        }
                    } else {
                        messageElement.style.color = '#c62828';
                        messageElement.textContent = power < 55 ? '❌ Недолет!' : '❌ Перелет!';
                        playSound('miss');
                    }

                    setTimeout(() => {
                        ball.style.left = '65px';
                        ball.style.bottom = '45px';
                        ball.style.transform = 'rotate(0deg)';
                        playerArm.style.transform = 'rotate(0deg)';
                        isThrowing = false;
                        if (isPlaying) messageElement.textContent = 'Зажмите кнопку для броска!';
                    }, 600);
                }
            }

            requestAnimationFrame(animate);
        }

        function startGame() {
            score = 0;
            level = 1;
            timeLeft = 30;
            scoreElement.textContent = score;
            levelElement.textContent = level;
            timerElement.textContent = timeLeft;
            isPlaying = true;
            actionBtn.textContent = 'Удерживайте для броска!';
            messageElement.style.color = '#333';

            // Таймер игры
            clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Движение кольца для уровней
            clearInterval(hoopMoveInterval);
            hoopMoveInterval = setInterval(() => {
                if (level > 1) {
                    hoopTop += hoopDirection * (1 + level * 0.5);
                    if (hoopTop > 70 || hoopTop < 10) {
                        hoopDirection *= -1;
                    }
                    hoopGroup.style.top = hoopTop + 'px';
                }
            }, 50);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(hoopMoveInterval);
            actionBtn.textContent = 'Начать игру!';
            messageElement.textContent = `⏰ Время вышло! Ваш результат: ${score}`;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('basketHighScore', highScore);
                highScoreElement.textContent = highScore;
                messageElement.textContent = `🎉 Новый рекорд: ${score} очков!`;
            }
        }
    </script>
</body>
</html>
