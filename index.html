<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бросок мяча в сетку</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Брось мяч в сетку!</h1>
        <div class="score-board">Очки: <span id="score">0</span></div>

        <div class="playground">
            <!-- Баскетбольное кольцо / сетка -->
            <div class="hoop" id="hoop">
                <div class="net"></div>
            </div>

            <!-- Мальчик и мяч -->
            <div class="player" id="player">👦</div>
            <div class="ball" id="ball">🏀</div>
        </div>

        <button class="btn-throw" id="throwBtn">Бросить мяч!</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
